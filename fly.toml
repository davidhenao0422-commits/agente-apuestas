# fly.toml — Configuración de despliegue para Fly.io
# Gratis para siempre, sin tarjeta de crédito, VM siempre activa.

app = "agente-apuestas"
primary_region = "sjc"  # San José, California (bueno para Latinoamérica)

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"
  PYTHONUNBUFFERED = "1"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false  # Nunca apagar (gratis)
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "connections"
    hard_limit = 25
    soft_limit = 20

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
